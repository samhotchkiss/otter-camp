name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

env:
  GO_VERSION: "1.21"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=3m

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    strategy:
      matrix:
        go: ["1.21"]
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run unit tests
        run: make test-unit
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-go${{ matrix.go }}
          path: coverage-unit.out
          retention-days: 7
      - name: Coverage gate
        run: |
          go tool cover -func=coverage-unit.out | tail -1
          COVERAGE=$(go tool cover -func=coverage-unit.out | tail -1 | awk '{print $3}' | sed 's/%//')
          if [ $(echo "$COVERAGE < 90.0" | bc -l) -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below the 90% minimum"
            exit 1
          fi

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ottercamp
          POSTGRES_PASSWORD: ottercamp
          POSTGRES_DB: ottercamp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run integration tests
        env:
          DATABASE_URL: postgres://ottercamp:ottercamp@localhost:5432/ottercamp_test?sslmode=disable
        run: make test-integration
      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: unit-tests
    strategy:
      matrix:
        go: ["1.21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build binary
        run: make build
      - name: Verify binary exists
        run: |
          test -f ./bin/ottercamp
          ./bin/ottercamp version
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ottercamp-linux-amd64-go${{ matrix.go }}
          path: ./bin/ottercamp
          retention-days: 7
