services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ottercamp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ottercamp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ottercamp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ottercamp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ottercamp-net

  ottercamp:
    image: ${OTTERCAMP_IMAGE:-ottercamp:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ottercamp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OTTERCAMP_MODE: ${OTTERCAMP_MODE:-production}
      OTTERCAMP_DATABASE_URL: postgres://${POSTGRES_USER:-ottercamp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ottercamp}?sslmode=disable
      OTTERCAMP_MASTER_KEY: ${OTTERCAMP_MASTER_KEY:?OTTERCAMP_MASTER_KEY is required}
      OTTERCAMP_ADDR: "0.0.0.0:4110"
      OTTERCAMP_WEB_DIR: ${OTTERCAMP_WEB_DIR:-/app/web/dist}
      OTTERCAMP_STORAGE_BACKEND: ${OTTERCAMP_STORAGE_BACKEND:-fs}
      OTTERCAMP_STORAGE_ROOT: ${OTTERCAMP_STORAGE_ROOT:-/app/data/objects}
      OTTERCAMP_LOG_LEVEL: ${OTTERCAMP_LOG_LEVEL:-info}
      OTTERCAMP_LOG_FORMAT: ${OTTERCAMP_LOG_FORMAT:-json}
      OTTERCAMP_AUTH_MODE: ${OTTERCAMP_AUTH_MODE:-standard}
      OTTERCAMP_TLS_MODE: ${OTTERCAMP_TLS_MODE:-none}
      OTTERCAMP_TLS_CERT: ${OTTERCAMP_TLS_CERT:-}
      OTTERCAMP_TLS_KEY: ${OTTERCAMP_TLS_KEY:-}
      OTTERCAMP_TLS_ACME_DOMAIN: ${OTTERCAMP_TLS_ACME_DOMAIN:-}
      OTTERCAMP_TLS_ACME_EMAIL: ${OTTERCAMP_TLS_ACME_EMAIL:-}
    volumes:
      - object-storage:/app/data/objects
    ports:
      - "${OTTERCAMP_PORT:-4110}:4110"
    command: ["serve"]
    networks:
      - ottercamp-net

  ottercamp-worker:
    image: ${OTTERCAMP_IMAGE:-ottercamp:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ottercamp-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ottercamp:
        condition: service_started
    environment:
      OTTERCAMP_MODE: ${OTTERCAMP_MODE:-production}
      OTTERCAMP_DATABASE_URL: postgres://${POSTGRES_USER:-ottercamp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ottercamp}?sslmode=disable
      OTTERCAMP_MASTER_KEY: ${OTTERCAMP_MASTER_KEY:?OTTERCAMP_MASTER_KEY is required}
      OTTERCAMP_STORAGE_BACKEND: ${OTTERCAMP_STORAGE_BACKEND:-fs}
      OTTERCAMP_STORAGE_ROOT: ${OTTERCAMP_STORAGE_ROOT:-/app/data/objects}
      OTTERCAMP_LOG_LEVEL: ${OTTERCAMP_LOG_LEVEL:-info}
      OTTERCAMP_LOG_FORMAT: ${OTTERCAMP_LOG_FORMAT:-json}
      OTTERCAMP_AUTH_MODE: ${OTTERCAMP_AUTH_MODE:-standard}
      OTTERCAMP_DB_MAX_CONNS: ${OTTERCAMP_DB_MAX_CONNS:-20}
      OTTERCAMP_WORKER_CONCURRENCY: ${OTTERCAMP_WORKER_CONCURRENCY:-4}
    volumes:
      - object-storage:/app/data/objects
    command: ["worker"]
    networks:
      - ottercamp-net

volumes:
  postgres-data:
    driver: local
  object-storage:
    driver: local

networks:
  ottercamp-net:
    driver: bridge
